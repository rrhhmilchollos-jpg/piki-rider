name: Play internal draft (manual only)
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Exact successful Android release workflow run ID from main'
        required: true
        type: string
      expected_commit_sha:
        description: 'Full 40-character commit SHA reviewed for this signed AAB'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: play-internal-draft
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate service credential is present (never log it)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo '::error::Falta PLAY_SERVICE_ACCOUNT_JSON. No se sube nada.'
            exit 1
          fi
      - name: Validate exact source run, branch, event, attempt, SHA and artifact
        id: source
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { validateBuildRun } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/play-release.mjs`).href);
            const id = process.env.BUILD_RUN_ID;
            const sha = process.env.EXPECTED_SHA;
            if (!/^\d+$/.test(id) || !Number.isSafeInteger(Number(id)) || !/^[a-f0-9]{40}$/i.test(sha)) {
              throw new Error('Se requieren el run ID numérico y SHA completo exactos; no se usa latest ni el run actual.');
            }
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...context.repo, workflow_id: 'android.yml' });
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(id) });
            const attempt = validateBuildRun(run, workflow.id, id, sha);
            if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('El build no pertenece al repositorio de publicación.');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: Number(id), per_page: 100 });
            const selected = artifacts.filter(a => a.name === 'piki-rider-signed-release-aab' && !a.expired);
            if (selected.length !== 1) throw new Error('Falta un único artefacto signed-release no caducado de ese run.');
            core.setOutput('run-id', id);
            core.setOutput('run-attempt', String(attempt));
            core.setOutput('sha', run.head_sha);
      - name: Download only the exact signed artifact from the selected run
        uses: actions/download-artifact@v4
        with:
          name: piki-rider-signed-release-aab
          path: aab
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded AAB signature, metadata and current Play maximum
        env:
          PIKI_EXPECTED_UPLOAD_CERT_SHA256: ${{ vars.PIKI_EXPECTED_UPLOAD_CERT_SHA256 }}
          PIKI_PLAY_MAX_VERSION_CODE: ${{ vars.PIKI_PLAY_MAX_VERSION_CODE }}
          PIKI_BUILD_RUN_ID: ${{ steps.source.outputs.run-id }}
          PIKI_BUILD_RUN_ATTEMPT: ${{ steps.source.outputs.run-attempt }}
          PIKI_BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/play-release.mjs check-download aab
      - name: Upload internal draft only; never production or automatic rollout
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pikidelivery.riders
          releaseFiles: aab/app-release.aab
          track: internal
          status: draft
