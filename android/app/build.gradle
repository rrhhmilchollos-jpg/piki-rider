import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def releaseVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
android {
    namespace = "com.pikidelivery.rider"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pikidelivery.riders"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName releaseVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    def signingStore = System.getenv("PIKI_SIGNING_STORE_FILE")
    if (signingStore) {
        signingConfigs {
            release {
                storeFile file(signingStore)
                storePassword System.getenv("PIKI_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("PIKI_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("PIKI_SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingStore) signingConfig signingConfigs.release
        }
    }
}

// Both debug and signed builds must embed the same release as the web bundle.
tasks.named('preBuild').configure {
    doFirst {
        exec {
            commandLine 'node', rootProject.file('../scripts/check-release-version.mjs').absolutePath, '--synced'
        }
    }
}

// Debug/PR tasks do not need secrets. Every release entry point fails closed.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project.path == ':app' && it.name.toLowerCase().contains('release') }) {
        def required = ['PIKI_SIGNING_STORE_FILE', 'PIKI_SIGNING_STORE_PASSWORD', 'PIKI_SIGNING_KEY_ALIAS', 'PIKI_SIGNING_KEY_PASSWORD', 'PIKI_EXPECTED_UPLOAD_CERT_SHA256', 'PIKI_PLAY_MAX_VERSION_CODE']
        def missing = required.findAll { !System.getenv(it)?.trim() }
        if (missing) throw new GradleException("Release bloqueada: faltan variables de firma (${missing.join(', ')}). No se genera un AAB sin firmar ni otra keystore.")
        if (!file(System.getenv('PIKI_SIGNING_STORE_FILE')).isFile()) throw new GradleException('Release bloqueada: no existe la keystore de subida configurada.')
        exec {
            commandLine 'node', rootProject.file('../scripts/require-android-signing.mjs').absolutePath
        }
        exec {
            commandLine 'python3', rootProject.file('../scripts/android-identity.py').absolutePath, 'check', '--synced'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
